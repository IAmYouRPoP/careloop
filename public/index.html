<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareLoop · Hospital visits, without the guesswork</title>
  <meta name="description" content="Find the right department, prepare for tests, check in and follow the queue live, and get recovery reminders after your hospital visit." />
  <meta name="theme-color" content="#0f766e" />
  <meta property="og:title" content="CareLoop" />
  <meta property="og:description" content="From “what’s wrong?” to “what do I do next?”: guidance before, during and after a hospital visit." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230f766e'/><path d='M9 16h4l2-5 3 10 2-5h3' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <script>
    // Apply the saved theme before first paint so dark mode doesn't flash white.
    try {
      const pick = localStorage.getItem('cl_theme');
      if (pick ? pick === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
    } catch {}
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'Noto Sans Devanagari', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a' } },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Design tokens: one quiet neutral palette, one teal accent, soft depth. */
    :root { --ink: #0b1324; --muted: #5b6678; --line: #e6eaf0; --line-strong: #d5dbe4; --surface: #ffffff; --canvas: #f5f7fa;
            --accent: #0f766e; --accent-hover: #0c5f59; --accent-soft: #e7f5f3; --ring: rgba(20,184,166,.28);
            --shadow-sm: 0 1px 2px rgba(16,24,40,.05); --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
            --shadow-lg: 0 12px 32px -12px rgba(16,24,40,.18); }
    body { -webkit-font-smoothing: antialiased; background: var(--canvas); color: var(--ink); font-feature-settings: 'cv11', 'ss01'; }
    ::selection { background: #99f6e4; color: #042f2e; }
    :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: .5rem; }
    h1, h2, h3 { letter-spacing: -.015em; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 2.5rem; border-radius: .7rem; padding: .5rem 1.05rem;
           font-weight: 600; font-size: .875rem; line-height: 1.2; transition: background .15s, box-shadow .15s, transform .05s, color .15s; white-space: nowrap; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(15,118,110,.35), inset 0 1px 0 rgba(255,255,255,.12); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow-sm); }
    .btn-ghost:hover:not(:disabled) { background: #f8fafc; box-shadow: inset 0 0 0 1px #c3cbd6, var(--shadow-sm); }
    .btn-danger { background: var(--surface); color: #b42318; box-shadow: inset 0 0 0 1px #f5c2bd, var(--shadow-sm); }
    .btn-danger:hover:not(:disabled) { background: #fef3f2; }
    .btn-sm { min-height: 2rem; padding: .3rem .7rem; font-size: .8rem; border-radius: .55rem; }

    .input { width: 100%; min-height: 2.6rem; border-radius: .7rem; border: 1px solid var(--line-strong); padding: .55rem .8rem; font-size: .9rem;
             background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
    textarea.input { min-height: auto; }
    .input::placeholder { color: #98a2b3; }
    .input:focus { outline: none; border-color: #14b8a6; box-shadow: 0 0 0 4px var(--ring); }
    .input:user-invalid { border-color: #f04438; }
    .label { display: block; font-size: .8125rem; font-weight: 500; color: #344054; margin-bottom: .35rem; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; box-shadow: var(--shadow); }
    a.card { transition: box-shadow .2s, border-color .2s, transform .2s; }
    a.card:hover { box-shadow: var(--shadow-lg); border-color: var(--line-strong); transform: translateY(-1px); }
    .badge { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .18rem .6rem; font-size: .72rem; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }

    .nav-link { padding: .4rem .8rem; border-radius: 999px; font-size: .85rem; font-weight: 500; color: var(--muted); white-space: nowrap; transition: background .15s, color .15s; }
    .nav-link:hover { background: #eef1f5; color: var(--ink); }
    .nav-link.active { background: var(--accent-soft); color: #0b5c56; font-weight: 600; }

    table.data { width: 100%; font-size: .875rem; border-collapse: separate; border-spacing: 0; }
    table.data th { text-align: left; font-weight: 600; color: #667085; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
                    padding: .7rem .9rem; background: #f9fafb; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.data td { padding: .75rem .9rem; border-bottom: 1px solid #f0f2f5; vertical-align: middle; }
    table.data tbody tr { transition: background .12s; }
    table.data tbody tr:hover { background: #fafbfc; }
    table.data tbody tr:last-child td { border-bottom: 0; }
    .card > table.data:first-child th:first-child, .card > .data:first-child th:first-child { border-top-left-radius: 1rem; }
    .card > table.data:first-child th:last-child { border-top-right-radius: 1rem; }

    .site-header { background: rgba(255,255,255,.82); border-color: rgba(226,232,240,.8); }
    .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
    .eyebrow { background: rgba(255,255,255,.8); }
    .cta-band { background: linear-gradient(90deg, #e7f5f3, #ffffff 70%); }
    html.dark .eyebrow { background: rgba(17,26,43,.8); --tw-ring-color: #324057; }
    html.dark .cta-band { background: linear-gradient(90deg, rgba(20,184,166,.14), #111a2b 70%); }
    html.dark .ring-slate-900\/5 { --tw-ring-color: rgba(255,255,255,.06); }
    html.dark .to-slate-200 { --tw-gradient-to: #243045; }
    html.dark .site-header { background: rgba(10,17,32,.82); border-color: #1c2638; }
    .hero-glow { background: radial-gradient(60% 60% at 15% 10%, rgba(20,184,166,.14), transparent 70%), radial-gradient(50% 50% at 90% 20%, rgba(56,189,248,.10), transparent 70%); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    #toasts > div { animation: toast-in .2s ease-out; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    #view > * { animation: fade-in .18s ease-out; }
    @media (prefers-reduced-motion: reduce) { #toasts > div, #view > *, a.card { animation: none; transition: none; } }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(20,184,166,.5); } 100% { box-shadow: 0 0 0 18px rgba(20,184,166,0); } }
    .pulse { animation: pulse-ring 1.6s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

    /* Dark mode: remaps the light palette used across the app (toggled by the ◐ button). */
    html.dark { color-scheme: dark; --ink: #e6ebf2; --muted: #98a3b5; --line: #222d40; --line-strong: #324057; --surface: #111a2b; --canvas: #0a1120;
                --accent-soft: rgba(20,184,166,.15); --shadow-sm: none; --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 32px -12px rgba(0,0,0,.6); }
    html.dark body { background: var(--canvas); color: var(--ink); }
    html.dark table.data th { background: #0f1828; color: #98a3b5; }
    html.dark table.data td { border-color: #1c2638; }
    html.dark table.data tbody tr:hover { background: #142036; }
    html.dark .btn-ghost:hover:not(:disabled) { box-shadow: inset 0 0 0 1px #3d4c66; }
    html.dark .label { color: #c3ccd9; }
    html.dark .nav-link.active { color: #5eead4; }
    html.dark .hero-glow { background: radial-gradient(60% 60% at 15% 10%, rgba(20,184,166,.16), transparent 70%), radial-gradient(50% 50% at 90% 20%, rgba(56,189,248,.10), transparent 70%); }
    html.dark .bg-white, html.dark .card, html.dark .btn-ghost, html.dark .input { background-color: #111a2b; }
    html.dark .bg-white\/90 { background-color: rgba(11,18,32,.9); }
    html.dark .bg-slate-50 { background-color: #0f1828; }
    html.dark .bg-slate-100 { background-color: #1a2436; }
    html.dark .hover\:bg-slate-50:hover, html.dark .hover\:bg-slate-100:hover, html.dark .btn-ghost:hover:not(:disabled), html.dark .nav-link:hover { background-color: #1a2436; }
    html.dark .card, html.dark .border-slate-200, html.dark .border-slate-100, html.dark .divide-slate-100 > * + *, html.dark table.data th, html.dark table.data td { border-color: #243045; }
    html.dark .input { border-color: #334155; color: #e2e8f0; }
    html.dark .btn-ghost { color: #e2e8f0; box-shadow: inset 0 0 0 1px #334155; }
    html.dark .text-slate-900 { color: #f1f5f9; }
    html.dark .text-slate-700, html.dark .text-slate-600, html.dark .label { color: #cbd5e1; }
    html.dark .text-slate-500 { color: #94a3b8; }
    html.dark .text-slate-400 { color: #7c8aa0; }
    html.dark .nav-link { color: #94a3b8; }
    html.dark .nav-link.active, html.dark .bg-brand-50 { background-color: rgba(20,184,166,.14); color: #5eead4; }
    html.dark .text-brand-700 { color: #5eead4; }
    html.dark .bg-emerald-50 { background-color: rgba(16,185,129,.14); } html.dark .text-emerald-700, html.dark .text-emerald-800 { color: #6ee7b7; }
    html.dark .bg-red-50, html.dark .bg-red-50\/60, html.dark .bg-red-50\/50 { background-color: rgba(239,68,68,.14); } html.dark .text-red-700, html.dark .text-red-800 { color: #fca5a5; }
    html.dark .bg-amber-50 { background-color: rgba(245,158,11,.14); } html.dark .text-amber-700, html.dark .text-amber-800, html.dark .text-amber-900 { color: #fcd34d; }
    html.dark .bg-sky-50 { background-color: rgba(14,165,233,.14); } html.dark .text-sky-700, html.dark .text-sky-800 { color: #7dd3fc; }
    html.dark .ring-slate-200, html.dark .ring-emerald-200, html.dark .ring-red-200, html.dark .ring-amber-200, html.dark .ring-sky-200, html.dark .ring-brand-100 { --tw-ring-color: rgba(148,163,184,.25); }
    html.dark .btn-danger { background: transparent; color: #fca5a5; box-shadow: inset 0 0 0 1px rgba(239,68,68,.45); }
    html.dark svg text[fill="#64748b"] { fill: #94a3b8; }
    html.dark svg line[stroke="#e2e8f0"] { stroke: #243045; }
    html.dark .h-3\.5.bg-slate-100 { background-color: #1a2436; }

    /* Print / Save as PDF: hide navigation and buttons, keep the content. */
    @media print {
      header, footer, #toasts, .btn, .print\:hidden, details > summary { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .card { break-inside: avoid; box-shadow: none !important; }
      main { max-width: none !important; padding: 0 !important; }
      details { display: block; } details > *:not(summary) { display: block !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app"></div>
  <div id="toasts" class="fixed bottom-4 right-4 left-4 sm:left-auto z-50 flex flex-col gap-2 items-end"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
