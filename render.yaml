# Render blueprint for the LIVE site with a free Neon PostgreSQL database.
# Render: New + > Blueprint > pick this repository. Render asks for the values marked sync: false:
#   DATABASE_URL    Neon connection string (Neon dashboard > Connect), ends with ?sslmode=require
#   ADMIN_EMAIL     your admin login email (used once, on the first start)
#   ADMIN_PASSWORD  12+ characters (used once, on the first start)
#   PUBLIC_URL      the site's address, e.g. https://careloop.onrender.com (fill in after the first deploy)
#
# Data lives in Neon, so it survives restarts and redeploys even on Render's free plan.
# The free plan still sleeps after 15 minutes idle: the next visit takes 30-60 s, and reminders
# wait until it wakes. A paid instance stays awake.
services:
  - type: web
    name: careloop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/features
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Kolkata
      - key: DEMO_MODE
        value: "off"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
